<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fav Paws - Cat Swipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="header">
    <h2 class="title">Fav Paws 🐾</h2>
    <p class="instructions">Swipe right to like, left to dislike</p>
  </header>
  
 <!-- Card stack -->
    <main id="stage">
<div id="card-container" class="hidden"></div>

<div id="loading" class="loader hidden">
    <div class="paw-loader">
        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>

        <div class="paw">
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="toe"></div>
            <div class="heel"></div>
        </div>
    </div>

    <span class="loading-text">Loading...</span>
</div>
</main>

     <!-- Footer pagination -->
    <footer id="footer">
      <div id="pagination" class="pagination hidden">
        &lt; 
        <span id="current">1</span>/
        <span id="total">10</span> &gt;
      </div>
    </footer>
    

<!-- Summary -->
    <section id="summary" class="hidden">
      <h2 class="summary-title" id="summary-title">You just liked <span id="like-count">0</span> cats!</h2>
      <div id="liked-images" class="liked-grid"></div>
      <button id="restart-btn" class="restart-btn">Start Again</button>
    </section>

    </div>
  <script src="script.js"></script>
</body>
</html>
