<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fav Paws - Cat Swipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h2 class="title">Fav Paws 🐾</h2>
    <p class="instructions">Swipe right to like, left to dislike</p>

    <div id="card-container"></div>

    <div id="summary" class="hidden">
      <h2>You liked <span id="like-count"></span> cats!</h2>
      <div id="liked-images"></div>
      <button id="restart-btn">Start Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
